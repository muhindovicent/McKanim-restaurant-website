name: DineSight Backend Foundation
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/dinesight-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dinesight_test:demo_password@127.0.0.1:5432/dinesight_test?schema=public
      CORS_ORIGINS: http://localhost:5500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies (temporary; commit a lock file before release)
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Generate Prisma client and type-check NestJS build
        run: npm run build
      - name: Run foundation tests
        run: npm test
      - name: Store dependency lockfile for reproducibility review
        uses: actions/upload-artifact@v4
        with:
          name: dinesight-backend-lockfile
          path: backend/package-lock.json
          if-no-files-found: error
          retention-days: 14

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dinesight_test
          POSTGRES_USER: dinesight_test
          POSTGRES_PASSWORD: demo_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dinesight_test -d dinesight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: '3001'
      DATABASE_URL: postgresql://dinesight_test:demo_password@127.0.0.1:5432/dinesight_test?schema=public
      CORS_ORIGINS: http://localhost:5500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build API
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Generate reviewable initial PostgreSQL migration
        run: |
          mkdir -p prisma/migrations/0_init
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
          cat prisma/sql/required-constraints.sql >> prisma/migrations/0_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Apply initial migration to ephemeral PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify real PostgreSQL constraints
        run: node scripts/verify-database.mjs
      - name: Validate running HTTP health and unpublished-menu behavior
        run: |
          set -e
          node dist/main.js > /tmp/dinesight-api-ci.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/v1/health/live
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/v1/public/restaurants/mckanim/menu)
          test "$CODE" = 404
      - name: Upload initial migration for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dinesight-initial-migration-sql
          path: backend/prisma/migrations/
          if-no-files-found: ignore
          retention-days: 14
